<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App icon: a round rubber dumbbell on a light studio background, in the style of the equipment pictures. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9dadd"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity=".38"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <!-- rubber band of a plate: lit from above -->
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5c61"/>
      <stop offset=".18" stop-color="#2b2c30"/>
      <stop offset=".7" stop-color="#17181a"/>
      <stop offset="1" stop-color="#0c0c0d"/>
    </linearGradient>
    <radialGradient id="face" cx="0.38" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#3a3b40"/>
      <stop offset=".6" stop-color="#202124"/>
      <stop offset="1" stop-color="#121214"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c9096"/>
      <stop offset=".25" stop-color="#f4f5f7"/>
      <stop offset=".5" stop-color="#a9adb3"/>
      <stop offset=".8" stop-color="#5d6167"/>
      <stop offset="1" stop-color="#3b3e43"/>
    </linearGradient>
    <linearGradient id="knurl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f737a"/>
      <stop offset=".3" stop-color="#c9ccd1"/>
      <stop offset=".6" stop-color="#80848a"/>
      <stop offset="1" stop-color="#3f4247"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="262" cy="384" rx="190" ry="26" fill="url(#shadow)"/>

  <!-- rear plate -->
  <g>
    <ellipse cx="118" cy="264" rx="44" ry="112" fill="#0e0e10"/>
    <rect x="118" y="152" width="56" height="224" fill="url(#band)"/>
    <ellipse cx="174" cy="264" rx="44" ry="112" fill="url(#face)"/>
    <ellipse cx="174" cy="264" rx="36" ry="96" fill="none" stroke="#2d2e32" stroke-width="3"/>
    <ellipse cx="174" cy="264" rx="11" ry="24" fill="#5b5f65"/>
  </g>

  <!-- handle -->
  <rect x="176" y="246" width="40" height="36" fill="url(#chrome)"/>
  <rect x="214" y="248" width="92" height="32" fill="url(#knurl)"/>
  <g stroke="#2f3236" stroke-opacity=".35" stroke-width="2">
    <path d="M222 250v28M230 250v28M238 250v28M246 250v28M254 250v28M262 250v28M270 250v28M278 250v28M286 250v28M294 250v28M302 250v28"/>
  </g>
  <rect x="304" y="246" width="34" height="36" fill="url(#chrome)"/>

  <!-- front plate -->
  <g>
    <ellipse cx="322" cy="264" rx="48" ry="120" fill="#0e0e10"/>
    <rect x="322" y="144" width="64" height="240" fill="url(#band)"/>
    <ellipse cx="386" cy="264" rx="48" ry="120" fill="url(#face)"/>
    <ellipse cx="386" cy="264" rx="39" ry="103" fill="none" stroke="#2d2e32" stroke-width="3"/>
    <ellipse cx="386" cy="264" rx="12" ry="26" fill="#62666c"/>
    <ellipse cx="383" cy="258" rx="5" ry="10" fill="#c8ccd1" opacity=".6"/>
  </g>
</svg>
