<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fressi Workout</title>
  <meta name="description" content="Personal workout plans, timers and machine guide for Fressi Jätkäsaari.">
  <meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0f11" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Fressi">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved light/dark choice before the page paints (avoids a flash).
    try { var t = JSON.parse(localStorage.getItem('fressi.v1') || '{}').settings?.theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <main id="view"></main>
  <div id="livebar" hidden></div>
  <nav id="nav" hidden></nav>
  <div id="sheet"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>This app needs JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
